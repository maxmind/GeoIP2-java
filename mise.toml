[settings]
experimental = true
lockfile = true
disable_backends = [
    "asdf",
    "vfox",
]

# Temurin, the default vendor for `java = "latest"`, has no macOS x64 build
# of Java 27, so the lockfile leaves out macos-x64.
lockfile_platforms = [
    "linux-arm64",
    "linux-arm64-musl",
    "linux-x64",
    "linux-x64-musl",
    "macos-arm64",
    "windows-x64",
]

[tools]
hugo = "latest"
java = "latest"
lychee = "latest"
maven = "latest"

[tasks.build-docs]
description = "Build the docs site with Hugo"
run = "hugo --source docs --minify"

[tasks.serve-docs]
description = "Serve the docs site locally with Hugo dev server"
run = "hugo server --source docs"

[tasks.check-links]
description = "Check links with lychee"
run = "lychee --no-progress './**/*.md' './src/**/*.java' './pom.xml'"

[hooks]
enter = "mise install --quiet --locked"

[[watch_files]]
patterns = ["mise.toml", "mise.lock"]
run = "mise install --quiet --locked"
